# Runs the collector on GitHub's servers every ~5 minutes and publishes the app to GitHub Pages.
# Free for public repositories. The previous run's state is downloaded from the live site,
# so nothing is committed to the repo on each run.
name: Collect news

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

concurrency:
  group: pages
  # A newer run WAITS for the one in progress (GitHub keeps one waiting run). Cancelling it threw away runs on
  # every push and, mid-publish, jammed GitHub Pages (2026-10-11 / 12). Stuck runs are still ended: the job's
  # 8-minute limit and the watchdog (cancels runs stuck 12+ minutes).
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - id: pages
        uses: actions/configure-pages@v5

      - name: Restore previous state from the live site
        run: |
          mkdir -p public/data
          # ?t= skips the Pages CDN cache (~10 min), so a run never starts from an older run's state
          curl -sfL "${{ steps.pages.outputs.base_url }}/data/state.json?t=$(date +%s)" -o public/data/state.json \
            || echo "No previous state (first run)"
          curl -sfL "${{ steps.pages.outputs.base_url }}/data/entities.json?t=$(date +%s)" -o public/data/entities.json \
            || echo "No topic knowledge base yet (built over the first runs)"

      - name: Collect
        run: node src/collect.js
        env:
          # Hebrew headlines + summaries (src/ai.js). Add the key under Settings → Secrets and variables → Actions.
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          # optional repository variables to switch provider/model (empty = Gemini Flash-Lite)
          AI_BASE_URL: ${{ vars.AI_BASE_URL }}
          AI_MODEL: ${{ vars.AI_MODEL }}
          AI_DAILY_CAP: ${{ vars.AI_DAILY_CAP }}
          # Telegram channel (src/telegram.js): bot token as a secret, channel ("@name") as a repository variable
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT: ${{ vars.TELEGRAM_CHAT }}
          TELEGRAM_ADMIN_CHAT: ${{ vars.TELEGRAM_ADMIN_CHAT }}

      - name: Tell the admin if the collection failed
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT: ${{ vars.TELEGRAM_ADMIN_CHAT }}
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_ADMIN_CHAT" ]; then
            curl -s "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" -d chat_id="$TELEGRAM_ADMIN_CHAT" \
              --data-urlencode text="⚠️ רדאר ספורט: ריצת האיסוף נכשלה — $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > /dev/null
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      # GitHub Pages sometimes fails on its side ("status: 500", or the artifact it was just given "not found",
      # 2026-10-14): one more try 30 seconds later before the run counts as failed (and emails the owner)
      - id: deploy
        uses: actions/deploy-pages@v4
        continue-on-error: true
        timeout-minutes: 6

      - name: Wait before retrying the publish
        if: steps.deploy.outcome == 'failure'
        run: sleep 30

      - id: deploy-retry
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4
        timeout-minutes: 6

      # GitHub pauses scheduled workflows after 60 days without repo activity; re-enabling resets that.
      - name: Keep schedule alive
        if: github.event_name == 'schedule'
        continue-on-error: true
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/collect.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}
