# DISCOVERY VERSION (trial) - a separate copy of the radar with its own address.
# Runs the collector on GitHub's servers and publishes the app to this repository's GitHub Pages.
# The previous run's state is downloaded from this version's live site; on the very first run it starts from
# the main radar's live data. Deliberately NO Telegram settings: this version can never post to the channel or
# message the admin. Its feedback / correction / claim channels are its own (see src/feedback.js).
name: Collect news (discovery)

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  MAIN_SITE: https://stacker33.github.io/sports-news

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - id: pages
        uses: actions/configure-pages@v5

      - name: Restore previous state (this site, else the main radar on the first run)
        run: |
          mkdir -p public/data
          t=$(date +%s)
          if ! curl -sfL "${{ steps.pages.outputs.base_url }}/data/state.json?t=$t" -o public/data/state.json; then
            # first run: start from the main radar's articles, but not its editors' votes, follows or channel positions
            curl -sfL "$MAIN_SITE/data/state.json?t=$t" -o public/data/state.json && node -e "
              const fs = require('fs'); const f = 'public/data/state.json'; const s = JSON.parse(fs.readFileSync(f, 'utf8'));
              for (const k of ['feedback', 'tg', 'healthAlerts', 'adminGreeted', 'userSearch', 'watchSched']) delete s[k];
              if (s.corrections) delete s.corrections.since;
              fs.writeFileSync(f, JSON.stringify(s));" \
              || echo "No previous state (first run)"
          fi
          curl -sfL "${{ steps.pages.outputs.base_url }}/data/entities.json?t=$t" -o public/data/entities.json \
            || curl -sfL "$MAIN_SITE/data/entities.json?t=$t" -o public/data/entities.json \
            || echo "No topic knowledge base yet"

      - name: Collect
        run: node src/collect.js
        env:
          # Hebrew headlines + summaries (src/ai.js). Optional: add AI_API_KEY under Settings → Secrets → Actions.
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_BASE_URL: ${{ vars.AI_BASE_URL }}
          AI_MODEL: ${{ vars.AI_MODEL }}
          AI_DAILY_CAP: ${{ vars.AI_DAILY_CAP }}
          # no TELEGRAM_* on purpose (see the top of this file)

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - id: deploy
        uses: actions/deploy-pages@v4

      - name: Keep schedule alive
        if: github.event_name == 'schedule'
        continue-on-error: true
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/collect.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}
