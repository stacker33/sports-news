# Runs the collector on GitHub's servers every ~5 minutes and publishes the app to GitHub Pages.
# Free for public repositories. The previous run's state comes from the Actions cache (fallback: a daily backup there),
# so nothing is committed to the repo on each run.
name: Collect news

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

concurrency:
  group: pages
  # A newer run WAITS for the one in progress (GitHub keeps one waiting run). Cancelling it threw away runs on
  # every push and, mid-publish, jammed GitHub Pages (2026-10-11 / 12). Stuck runs are still ended: the job's
  # 8-minute limit and the watchdog (cancels runs stuck 12+ minutes).
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - id: pages
        uses: actions/configure-pages@v5

      # The radar's memory (state.json, entities.json) lives in GitHub's Actions cache: free, not counted against
      # GitHub Pages' ~100 GB/month bandwidth, and not public (the site no longer publishes state.json).
      # Order: the newest saved copy → the daily backup copy → stop. Never an empty or unverified state.
      - name: Restore previous state from the Actions cache
        uses: actions/cache/restore@v4
        with:
          path: .state-cache
          key: radar-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: radar-state-

      - name: Use the cached state
        id: main
        run: |
          mkdir -p public/data
          # the site's latest publish time (data/version.json): logged when the cached copy is older
          curl -sfL "${{ steps.pages.outputs.base_url }}/data/version.json?t=$(date +%s)" -o .site-version.json || rm -f .site-version.json
          if node scripts/pick-state.mjs .state-cache/state.json .site-version.json public/data/state.json --allow-older; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
            echo "STATE_FROM=cache" >> "$GITHUB_ENV"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore the daily backup from the Actions cache
        if: steps.main.outputs.ok != 'true'
        uses: actions/cache/restore@v4
        with:
          path: .state-backup
          key: radar-backup-none
          restore-keys: radar-backup-

      - name: Restore previous state (backup, else stop)
        if: steps.main.outputs.ok != 'true'
        run: |
          # 2. The daily backup (up to a day old: some recent articles are collected again; nothing else is lost)
          if node scripts/pick-state.mjs .state-backup/state.json .site-version.json public/data/state.json --allow-older; then
            echo "::warning::The newest state copy was missing or invalid: started from the daily backup."
            echo "STATE_FROM=backup" >> "$GITHUB_ENV"
            exit 0
          fi
          # 3. Last resort while the site still publishes a copy (removed from the site on 2026-10-24): validated, else stop
          rm -f public/data/state.json.download
          if ! curl -sfL --compressed "${{ steps.pages.outputs.base_url }}/data/state.json?t=$(date +%s)" -o public/data/state.json.download; then
            rm -f public/data/state.json.download
            echo "state:missing" > .state-error
            echo "::error::No usable state (cache, backup or site). Stopping before collection and publishing; the site keeps its last version."
            exit 1
          fi
          node scripts/restore-state.mjs public/data/state.json.download public/data/state.json .state-error
          echo "STATE_FROM=site" >> "$GITHUB_ENV"

      - name: Restore the topic knowledge base
        run: |
          # Optional (src/entities.js rebuilds it when missing): only a complete file is used
          for f in .state-cache/entities.json .state-backup/entities.json; do
            if [ -f "$f" ] && node -e "JSON.parse(require('fs').readFileSync('$f', 'utf8'))"; then cp "$f" public/data/entities.json; break; fi
          done
          if [ ! -f public/data/entities.json ]; then
            if curl -sfL --compressed "${{ steps.pages.outputs.base_url }}/data/entities.json?t=$(date +%s)" -o public/data/entities.json.download \
              && node -e "JSON.parse(require('fs').readFileSync('public/data/entities.json.download', 'utf8'))"; then
              mv public/data/entities.json.download public/data/entities.json
            else
              rm -f public/data/entities.json.download
              echo "No usable topic knowledge base (rebuilt over the next runs)"
            fi
          fi

      # The previous publish's news files, so the collector can write what changed (data/delta.json, src/delta.js).
      # Optional: without them the page simply downloads the full files.
      - name: Restore the previous publish
        run: |
          for f in news.json news-more.json; do
            for d in .state-cache .state-backup; do
              if [ -f "$d/$f" ] && node -e "JSON.parse(require('fs').readFileSync('$d/$f', 'utf8'))"; then cp "$d/$f" "public/data/$f"; break; fi
            done
          done

      - name: Collect
        run: node src/collect.js
        env:
          # Hebrew headlines + summaries (src/ai.js). Add the key under Settings → Secrets and variables → Actions.
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          # optional repository variables to switch provider/model (empty = Gemini Flash-Lite)
          AI_BASE_URL: ${{ vars.AI_BASE_URL }}
          AI_MODEL: ${{ vars.AI_MODEL }}
          AI_DAILY_CAP: ${{ vars.AI_DAILY_CAP }}
          # Telegram channel (src/telegram.js): bot token as a secret, channel ("@name") as a repository variable
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT: ${{ vars.TELEGRAM_CHAT }}
          TELEGRAM_ADMIN_CHAT: ${{ vars.TELEGRAM_ADMIN_CHAT }}
          # ✉️ the radar's own Gmail for "send to web@sport5.co.il" (src/mailer.js); empty = the page opens the editor's mail program
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}

      # Keep this run's memory for the next run (see "Restore previous state from the Actions cache")
      - name: Copy the new state for the Actions cache
        continue-on-error: true # a cache problem never blocks publishing: the next run falls back to the site
        run: |
          mkdir -p .state-cache
          cp public/data/state.json .state-cache/state.json
          if [ -f public/data/entities.json ]; then cp public/data/entities.json .state-cache/entities.json; fi
          # this publish's news files: the next run writes data/delta.json (what changed) against them
          for f in news.json news-more.json; do if [ -f "public/data/$f" ]; then cp "public/data/$f" ".state-cache/$f"; fi; done

      - name: Save the new state in the Actions cache
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: .state-cache
          key: radar-state-${{ github.run_id }}-${{ github.run_attempt }}

      # Once a day the same copy is also kept as a backup (the first run of each UTC day saves it; later runs find the
      # key taken and skip). Kept separately from the copies the cleanup below deletes.
      - name: Day key for the backup
        id: day
        run: echo "key=radar-backup-$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: Save the daily backup in the Actions cache
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: .state-cache
          key: ${{ steps.day.outputs.key }}

      # Each run saves a new copy (cache entries can't be overwritten): keep the newest 5, delete the rest, so the
      # 10 GB cache never fills up and GitHub never has to evict anything itself.
      - name: Delete older state copies from the Actions cache
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh cache list --repo "${{ github.repository }}" --key radar-state- --sort created_at --order desc --limit 100 --json id --jq '.[5:][].id' \
            | xargs -r -n1 gh cache delete --repo "${{ github.repository }}"
          # daily backups: the newest 3
          gh cache list --repo "${{ github.repository }}" --key radar-backup- --sort created_at --order desc --limit 50 --json id --jq '.[3:][].id' \n            | xargs -r -n1 gh cache delete --repo "${{ github.repository }}"

      - name: Tell the admin if the collection failed
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT: ${{ vars.TELEGRAM_ADMIN_CHAT }}
        run: |
          # a state problem left a short sanitized code (e.g. "state:parse"); only [a-z:-] is passed on
          REASON=""
          if [ -f .state-error ]; then REASON=$(tr -cd 'a-z:-' < .state-error | head -c 40 || true); fi
          if [ -n "$REASON" ]; then echo "Stopped: $REASON (the site keeps its last good version)" >> "$GITHUB_STEP_SUMMARY"; fi
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_ADMIN_CHAT" ]; then
            curl -s "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" -d chat_id="$TELEGRAM_ADMIN_CHAT" \
              --data-urlencode text="⚠️ רדאר ספורט: ריצת האיסוף נכשלה${REASON:+ ($REASON)} — $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > /dev/null
          fi

      # The memory is not published: it stays in the Actions cache (it held the admin's Telegram id and editors' data)
      - name: Keep the memory off the public site
        run: rm -f public/data/state.json public/data/*.download

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      # GitHub Pages sometimes fails on its side ("status: 500", or the artifact it was just given "not found",
      # 2026-10-14): one more try 30 seconds later before the run counts as failed (and emails the owner)
      - id: deploy
        uses: actions/deploy-pages@v4
        continue-on-error: true
        timeout-minutes: 6

      - name: Wait before retrying the publish
        if: steps.deploy.outcome == 'failure'
        run: sleep 30

      - id: deploy-retry
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4
        timeout-minutes: 6

      # GitHub pauses scheduled workflows after 60 days without repo activity; re-enabling resets that.
      - name: Keep schedule alive
        if: github.event_name == 'schedule'
        continue-on-error: true
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/collect.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}
