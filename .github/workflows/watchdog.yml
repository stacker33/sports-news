# DISCOVERY VERSION (trial) watchdog - REPAIR ONLY, NO MESSAGES.
# Every 15 minutes: if this version's site has stopped updating, cancel collect runs stuck for 12+ minutes and
# start a fresh one (src/watchdog.js). It never messages anyone: REPAIR_ONLY is set and no Telegram settings are
# passed, so alerts are only written to the run log. GitHub's own schedule is unreliable; a cron-job.org job that
# dispatches this workflow every 15 minutes makes it dependable.
name: Watchdog (discovery, repair only)

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: write # only for the empty commit that unjams a stuck Pages publish

concurrency:
  group: watchdog
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # when it went stale, kept between runs
      - name: Restore watchdog state
        uses: actions/cache/restore@v4
        with:
          path: .watchdog
          key: watchdog-${{ github.run_id }}
          restore-keys: watchdog-

      - name: Check this version's site and repair it if stuck
        run: node src/watchdog.js
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SITE_URL: https://stacker33.github.io/sports-news-discovery
          REPAIR_ONLY: '1'
          # no TELEGRAM_* on purpose

      - name: Save watchdog state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .watchdog
          key: watchdog-${{ github.run_id }}
