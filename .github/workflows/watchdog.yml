# Watchdog: checks every 15 minutes that the live site is still updating; if not, cancels stuck collect runs,
# starts a fresh one and tells the admin on Telegram (src/watchdog.js). Its own concurrency group, so a stuck
# collect run can't block it.
name: Watchdog

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: watchdog
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # when it went stale / when we last alerted, kept between runs
      - name: Restore watchdog state
        uses: actions/cache/restore@v4
        with:
          path: .watchdog
          key: watchdog-${{ github.run_id }}
          restore-keys: watchdog-

      - name: Check the live site
        run: node src/watchdog.js
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT: ${{ vars.TELEGRAM_ADMIN_CHAT }}

      - name: Save watchdog state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .watchdog
          key: watchdog-${{ github.run_id }}
