<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Sports Radar</title>
  <meta name="description" content="Live sports news and scores: football, basketball, Israeli sport — Hebrew + English" />
  <meta name="theme-color" content="#0b0f14" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="stylesheet" href="style.css" />
</head>
<body data-view="news">
  <header class="top">
    <div class="bar">
      <div class="brand">
        <span class="logo" aria-hidden="true">📡</span>
        <span class="name" data-i18n="appName">Sports Radar</span>
      </div>
      <div class="status" id="status"><span class="dot"></span><span id="statusText">…</span></div>
      <a class="tg-btn" id="tgBtn" href="https://t.me/sportsradar55" target="_blank" rel="noopener" aria-label="Telegram">
        <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path fill="currentColor" d="M21.9 4.3 18.7 19.5c-.2 1-.9 1.3-1.8.8l-4.9-3.6-2.4 2.3c-.3.3-.5.5-1 .5l.3-5 9.1-8.2c.4-.4-.1-.6-.6-.2L6.2 13.2l-4.8-1.5c-1-.3-1.1-1 .2-1.5L20.5 2.9c.9-.3 1.7.2 1.4 1.4z"/></svg>
        <span id="tgLabel"></span>
      </a>
      <button class="icon-btn" id="bellBtn" aria-label="Notifications">🔔</button>
      <button class="lang-btn" id="langBtn" aria-label="Switch language">EN</button>
    </div>

    <div class="news-controls">
      <nav class="tabs" id="tabs" role="tablist"></nav>
      <div class="filters">
        <input id="search" type="search" autocomplete="off" data-i18n-placeholder="search" />
        <div class="seg" id="langFilter" role="group"></div>
        <button type="button" class="s5-filter" id="s5Filter" aria-pressed="false"></button>
        <label class="mix">
          <span id="mixLabelNew"></span>
          <input type="range" id="mix" min="0" max="100" step="5" aria-label="Newest ↔ most popular" />
          <span id="mixLabelPop"></span>
        </label>
      </div>
      <div class="topics-bar" id="topicsBar"></div>
      <div class="athletes rival-bar" id="rivalBar" hidden></div>
      <div class="abroad-bar" id="abroadBar" hidden>
        <div class="athletes" id="athleteChips"></div>
        <div class="abroad-tools">
          <div class="seg" id="teamSeg" role="group"></div>
          <button class="small-btn" id="editListBtn" data-i18n="editList"></button>
        </div>
      </div>
    </div>
  </header>

  <button class="new-pill" id="newPill" hidden></button>

  <div class="layout">
    <section class="news-pane">
      <main id="list" aria-live="polite"></main>
      <p class="empty" id="empty" hidden data-i18n="empty"></p>
    </section>

    <aside class="side" id="side">
      <div class="side-tabs seg" id="sideTabs" role="tablist"></div>
      <section id="scoresPane" class="side-pane"></section>
      <section id="justinPane" class="side-pane" hidden></section>
    </aside>
  </div>

  <footer class="foot" id="foot"></footer>

  <nav class="bottom-nav" id="bottomNav"></nav>

  <!-- Notifications settings -->
  <dialog id="notifDialog" class="dlg">
    <form method="dialog" class="dlg-body" id="notifForm"></form>
  </dialog>

  <!-- My topics: create / edit a saved topic -->
  <dialog id="topicDialog" class="dlg">
    <form method="dialog" class="dlg-body" id="topicForm"></form>
  </dialog>

  <!-- Israelis-abroad list editor -->
  <dialog id="listDialog" class="dlg dlg-wide">
    <div class="dlg-body" id="listBody"></div>
  </dialog>

  <script src="scores.js" defer></script>
  <script src="learn.js" defer></script>
  <script src="app.js" defer></script>
</body>
</html>
